<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barkod Okuyucu">
    <meta name="application-name" content="Barkod Okuyucu">
    <title>Barkod Okuyucu</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="apple-touch-icon" href="./icons/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="scanner-card">
        <div class="scanner-header">
          <div>
            <h2>Canlı Tarama</h2>
            <p id="statusText">Kamera başlatılmadı.</p>
          </div>
          <span class="status-pill" id="cameraState">Pasif</span>
        </div>

        <div id="reader" class="reader-frame" aria-label="Kamera önizleme alanı"></div>

        <div class="control-grid">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon" aria-hidden="true">📷</span>
            <span id="startButtonLabel">Kamerayı Aç</span>
          </button>
          <button id="scanFileButton" class="ghost-button" type="button">
            <span class="button-icon" aria-hidden="true">🖼️</span>
            <span>Resimden Tara</span>
          </button>
          <button id="torchButton" class="ghost-button" type="button" disabled>
            <span class="button-icon" aria-hidden="true">🔦</span>
            <span id="torchButtonLabel">Flaş</span>
          </button>
        </div>

        <input id="fileInput" type="file" accept="image/*" hidden>
      </section>

      <section class="history-card">
        <details class="history-accordion">
          <summary class="history-summary">
            <span class="history-summary-title">
              <span class="button-icon" aria-hidden="true">🕘</span>
              <span>Geçmiş</span>
            </span>
            <span class="history-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="history-content">
            <div class="section-title history-tools">
              <h2>Son Okumalar</h2>
              <button id="clearHistoryButton" class="inline-button" type="button">Temizle</button>
            </div>
            <ul id="historyList" class="history-list">
              <li class="history-empty">Henüz tarama yapılmadı.</li>
            </ul>
          </div>
        </details>
      </section>
    </main>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
